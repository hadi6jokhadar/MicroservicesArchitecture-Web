server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (2026-07 frontend security audit item #2).
    # NOTE: connect-src below matches apps/nasheed/admin/src/environments/environment.docker.ts
    # (the config this image is built with — see Dockerfile: --configuration=docker).
    # This app has no "category" apiUrl, so port 5007 is intentionally omitted (unlike apps/admin).
    # If the deployment host (ihsandev.gleeze.com) or any service port changes, update
    # BOTH that environment file AND this CSP together.
    # connect-src includes blob: because WaveSurfer.js (libs/shared file-manager's
    # audio-editor-dialog) internally fetch()es the blob: URL it creates from the source
    # file/enhanced-audio Blob to render waveforms — that fetch is checked against
    # connect-src, not media-src, and 'self' does NOT cover the blob: scheme.
    # media-src also includes blob: because the same dialog's <audio> element plays that
    # blob: object URL directly for local preview before/during upload.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.r2.dev http://ihsandev.gleeze.com:5000 http://ihsandev.gleeze.com:5005; font-src 'self'; media-src 'self' blob: https://*.r2.dev http://ihsandev.gleeze.com:5000 http://ihsandev.gleeze.com:5005; worker-src 'self' blob:; connect-src 'self' blob: http://ihsandev.gleeze.com:5000 http://ihsandev.gleeze.com:5001 http://ihsandev.gleeze.com:5002 http://ihsandev.gleeze.com:5004 http://ihsandev.gleeze.com:5005 http://ihsandev.gleeze.com:5006 http://ihsandev.gleeze.com:5008 http://ihsandev.gleeze.com:5009 ws://ihsandev.gleeze.com:5000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
