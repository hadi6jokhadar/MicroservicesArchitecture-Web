server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (2026-07 frontend security audit item #2).
    # NOTE: apps/nasheed/web has no environments/ folder yet (see its Dockerfile comment) and
    # currently makes no backend API calls — it is a scaffold. connect-src is therefore left at
    # 'self' only. Widen connect-src (and img-src/media-src for file/blob origins) here the same
    # way apps/admin/nginx.conf and apps/nasheed/admin/nginx.conf do once this app is wired to
    # real API/environment config — do NOT guess the origins in advance.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
